<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — ProofChain</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/layout.css" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">
      <span class="brand-dot"></span>
      <span class="brand-name">ProofChain</span>
    </div>
    <ul class="nav-links">
  <li><a href="../index.html">Home</a></li>
  <li><a href="dashboard.html" class="active">Dashboard</a></li>
  <li><a href="profile.html">Skills</a></li>
  <li><a href="evidence.html">Evidence</a></li>
  <li><a href="assessment.html">Assessments</a></li>
  <li><a href="recruiter.html">Recruiter View</a></li>
</ul>
  </nav>

  <main class="dashboard">

    <aside class="dash-sidebar">
      <div class="card student-card">
        <div class="student-avatar" id="student-avatar">A</div>
        <h2 class="student-name" id="student-name">Loading...</h2>
        <p class="student-course" id="student-course"></p>
        <p class="student-goal" id="student-goal"></p>
        <div class="student-actions">
          <button class="btn btn-ghost btn-small" id="reset-btn">Reset Demo Data</button>
        </div>
      </div>
    </aside>

    <section class="dash-main">

      <div class="summary-grid">
        <div class="summary-tile">
          <p class="summary-label">Skills Tracked</p>
          <p class="summary-value" id="stat-skills">0</p>
        </div>
        <div class="summary-tile">
          <p class="summary-label">Evidence Items</p>
          <p class="summary-value" id="stat-evidence">0</p>
        </div>
        <div class="summary-tile">
          <p class="summary-label">Avg Confidence</p>
          <p class="summary-value" id="stat-confidence">0%</p>
        </div>
        <div class="summary-tile">
          <p class="summary-label">Verified</p>
          <p class="summary-value" id="stat-verified">0</p>
        </div>
      </div>

      <div class="section-header">
        <h2>Your Skills</h2>
        <a href="profile.html" class="btn btn-ghost btn-small">+ Add Skill</a>
      </div>
      <div id="skills-container" class="skills-grid"></div>

      <div class="section-header">
        <h2>Next Proof</h2>
      </div>
      <div id="recommendations" class="recommendations"></div>

    </section>
  </main>

  <footer class="footer">
    <p>ProofChain · Evidence-based skill verification · BCS Major Project</p>
  </footer>

 <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase.js"></script>
<script src="../js/seed.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/store.js"></script>
<script src="../js/models.js"></script>
<script src="../js/scoring.js"></script>
<script src="../js/dashboard.js"></script>
<script src="../js/guard.js"></script>
</body>
</html>
